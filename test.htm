<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PyScriptの使い方02</title>
    <link rel="stylesheet" href="https://pyscript.net/alpha/pyscript.css" />
    <script defer src="https://pyscript.net/alpha/pyscript.js"></script>
</head>
<body>
<py-script>
    value = "みかん"
    if value == "りんご":
       print('りんごです！')
    elif value == "みかん":
      print('みかんです！')
    elif value == "ばなな":
      print('ばななです！')
    else:
        print('フルーツではありません。')
</py-script>
</body>
</html>
